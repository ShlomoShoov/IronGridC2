services:
  kafka:
    image: apache/kafka:latest
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://${KAFKA_BOOTSTRAP_SERVER},CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://${KAFKA_BOOTSTRAP_SERVER}
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 1
    healthcheck:
      test: ["CMD", "opt/kafka/bin/kafka-topics.sh","--bootstrap-server",$KAFKA_BOOTSTRAP_SERVER,"--list"]
      interval: 30s
      timeout: 30s
      retries: 5
      start_period: 30s

  producer:
    build:
      context: ./Producer
      dockerfile: Dockerfile
    container_name: producer
    environment:
      - kafka__BootstrapServers=${KAFKA_BOOTSTRAP_SERVER}
      - kafka__PerimeterSensorTopicName=${PERIMETER_SENSOR_TOPIC_NAME}
      - kafka__UAVTopicName=${UAV_TOPIC_NAME}

    depends_on:
      kafka:
        condition: service_healthy
  mysql:
    image: mysql:8.4
    container_name: mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: testDb
    ports:
     - "3306:3306"

